name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - 'wp*'
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  core-tests:
    name: Core Tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run release test gate
        shell: pwsh
        run: ./build.ps1 -Target Test -Configuration Release

  integration-tests:
    name: Integration Tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run release integration gate
        shell: pwsh
        run: ./build.ps1 -Target IntegrationTest -Configuration Release
